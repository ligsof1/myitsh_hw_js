<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="conteneer">
        <div class="stroka-1">
            
        </div>
        <div class="stroka-2">
            <div class="button clearspan">C</div>
            <div class="button scobki">+/-</div>
            <div class="button percent">%</div>
            <div class="button division">/</div>
        </div>
        <div class="stroka-3">
            <div class="button number_7">7</div>
            <div class="button number_8">8</div>
            <div class="button number_9">9</div>
            <div class="button multiply">x</div>
        </div>
        <div class="stroka-4">
            <div class="button number_4">4</div>
            <div class="button number_5">5</div>
            <div class="button number_6">6</div>
            <div class="button minus">-</div>
        </div>
        <div class="stroka-5">
            <div class="button number_1">1</div>
            <div class="button number_2">2</div>
            <div class="button number_3">3</div>
            <div class="button plus">+</div>
        </div>
        <div class="stroka-6">
            <div class="button nuber_0">0</div>
            <div class="button point">.</div>
            <div class="button result">=</div>
        </div>
    </div>
    <div class="info">
        <p>проценты  +/- не работает </p>
    </div>
    <script src="js1.js"></script>
</body>
</html>
